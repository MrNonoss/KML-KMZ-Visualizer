<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Dark Slate Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131c2e" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Cyan Trajectory Glow Gradient -->
    <linearGradient id="pathGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Orange Active Pin / Playhead Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Drop Shadow & Glow Filter -->
    <filter id="cyanGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Rounded App Icon Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#273652" stroke-width="8" />

  <!-- Subtle Map Lat/Lon Graticule Grid & Globe Rings -->
  <g stroke="#1e2d47" stroke-width="3" opacity="0.75" fill="none">
    <circle cx="256" cy="256" r="180" stroke-dasharray="10 10" />
    <circle cx="256" cy="256" r="115" />
    <line x1="56" y1="176" x2="456" y2="176" />
    <line x1="56" y1="256" x2="456" y2="256" />
    <line x1="56" y1="336" x2="456" y2="336" />
    <line x1="176" y1="56" x2="176" y2="456" />
    <line x1="256" y1="56" x2="256" y2="456" />
    <line x1="336" y1="56" x2="336" y2="456" />
  </g>

  <!-- Stylized Coastline / Map Contour Accent -->
  <path d="M 48 360 Q 130 330 170 385 T 310 410 T 464 340 L 464 440 Q 464 480 420 480 L 92 480 Q 48 480 48 430 Z"
        fill="#0f1829" opacity="0.75" />

  <!-- Animated Trajectory S-Curve Polyline (Outer Glow + Inner Core) -->
  <path d="M 104 374 C 135 280, 195 345, 232 256 C 266 174, 308 215, 368 158"
        fill="none" stroke="#0284c7" stroke-width="26" stroke-linecap="round" opacity="0.32" />
  <path d="M 104 374 C 135 280, 195 345, 232 256 C 266 174, 308 215, 368 158"
        fill="none" stroke="url(#pathGrad)" stroke-width="14" stroke-linecap="round" filter="url(#cyanGlow)" />

  <!-- Visited Waypoint Nodes Along the Path -->
  <!-- Fix #1 (Emerald Visited Node) -->
  <circle cx="104" cy="374" r="14" fill="#10b981" stroke="#090d16" stroke-width="5" />
  <!-- Fix #2 (Amber Stationary Dwell Halo + Node) -->
  <circle cx="232" cy="256" r="28" fill="#f59e0b" fill-opacity="0.22" stroke="#f59e0b" stroke-width="3" />
  <circle cx="232" cy="256" r="13" fill="#fbbf24" stroke="#090d16" stroke-width="5" />

  <!-- Active Markerhead Radar Pulse Ring at Destination (368, 158) -->
  <circle cx="368" cy="158" r="46" fill="#f97316" fill-opacity="0.18" stroke="#38bdf8" stroke-width="3.5" stroke-dasharray="12 8" />

  <!-- Location Pin + Play Triangle Combined Emblem at Active Fix -->
  <g filter="url(#pinShadow)">
    <path d="M 368 58
             C 332 58, 304 86, 304 122
             C 304 166, 368 222, 368 222
             C 368 222, 432 166, 432 122
             C 432 86, 404 58, 368 58 Z"
          fill="url(#pinGrad)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
    <!-- Play Button Triangle Inside Location Pin Head -->
    <polygon points="356,101 356,143 392,122" fill="#ffffff" />
  </g>

  <!-- Bottom Timeline Scrubber Bar Emblem -->
  <rect x="84" y="424" width="344" height="24" rx="12" fill="#0b0f17" stroke="#273652" stroke-width="3" />
  <rect x="92" y="431" width="236" height="10" rx="5" fill="url(#pathGrad)" />
  <circle cx="328" cy="436" r="10" fill="#f97316" stroke="#ffffff" stroke-width="3" />
</svg>
